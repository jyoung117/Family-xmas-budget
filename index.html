<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Christmas Budget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 shadow-md">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="bg-red-600 text-white p-2 rounded-xl shadow">
                    <i class="fa-solid fa-gift text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Xmas Budget</h1>
                    <p class="text-xs text-slate-400" id="sync-status">Checking Connection...</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="openPwaModal()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 p-2 rounded-lg text-sm" title="Install App">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                </button>
                <button onclick="openSettingsModal()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 p-2 rounded-lg text-sm" title="Firebase Settings">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto w-full px-4 py-6 flex-1 pb-24">
        <!-- Summary Cards -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-2xl shadow">
                <p class="text-xs text-slate-400 uppercase font-semibold">Total Budget</p>
                <p class="text-2xl font-bold text-white mt-1" id="total-budget-display">$0.00</p>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-2xl shadow">
                <p class="text-xs text-slate-400 uppercase font-semibold">Total Spent</p>
                <p class="text-2xl font-bold text-red-400 mt-1" id="total-spent-display">$0.00</p>
            </div>
        </div>

        <!-- Action Button -->
        <button onclick="openAddRecipientModal()" class="w-full bg-gradient-to-r from-red-600 to-rose-600 text-white font-semibold py-3 px-4 rounded-xl shadow-lg flex items-center justify-center space-x-2 mb-6">
            <i class="fa-solid fa-user-plus"></i>
            <span>Add Family Member / Recipient</span>
        </button>

        <!-- Recipients List -->
        <div id="recipients-container" class="space-y-4"></div>
    </main>

    <!-- Add Recipient Modal -->
    <div id="recipient-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-2xl p-5 shadow-2xl">
            <h3 class="text-lg font-bold mb-4 flex items-center space-x-2">
                <i class="fa-solid fa-user text-red-500"></i>
                <span id="recipient-modal-title">Add Recipient</span>
            </h3>
            <form onsubmit="handleSaveRecipient(event)" class="space-y-4">
                <input type="hidden" id="recipient-id">
                <div>
                    <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Name</label>
                    <input type="text" id="recipient-name" required placeholder="e.g. Daughter" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-red-500">
                </div>
                <div>
                    <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Budget Amount ($)</label>
                    <input type="number" step="0.01" id="recipient-budget" required placeholder="150.00" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-red-500">
                </div>
                <div class="flex space-x-3 pt-2">
                    <button type="button" onclick="closeModals()" class="flex-1 bg-slate-700 py-2.5 rounded-xl font-medium">Cancel</button>
                    <button type="submit" class="flex-1 bg-red-600 py-2.5 rounded-xl font-semibold shadow">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Add Expense Modal -->
    <div id="expense-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-2xl p-5 shadow-2xl">
            <h3 class="text-lg font-bold mb-1 flex items-center space-x-2">
                <i class="fa-solid fa-cart-shopping text-red-500"></i>
                <span>Add Purchase</span>
            </h3>
            <p class="text-xs text-slate-400 mb-4" id="expense-modal-subtitle">For Recipient</p>
            <form onsubmit="handleSaveExpense(event)" class="space-y-4">
                <input type="hidden" id="expense-recipient-id">
                <div>
                    <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Item Description</label>
                    <input type="text" id="expense-item" required placeholder="e.g. Lego Set" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-red-500">
                </div>
                <div>
                    <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Cost ($)</label>
                    <input type="number" step="0.01" id="expense-cost" required placeholder="49.99" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-red-500">
                </div>
                <div>
                    <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Purchased By</label>
                    <input type="text" id="expense-buyer" placeholder="Mom / Dad" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-red-500">
                </div>
                <div class="flex space-x-3 pt-2">
                    <button type="button" onclick="closeModals()" class="flex-1 bg-slate-700 py-2.5 rounded-xl font-medium">Cancel</button>
                    <button type="submit" class="flex-1 bg-red-600 py-2.5 rounded-xl font-semibold shadow">Add Item</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-2xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
            <h3 class="text-lg font-bold mb-2 flex items-center space-x-2">
                <i class="fa-solid fa-gear text-red-500"></i>
                <span>Firebase Sync Settings</span>
            </h3>
            <p class="text-xs text-slate-400 mb-4">Paste your Firebase credentials below to connect both phones.</p>
            <form onsubmit="handleSaveSettings(event)" class="space-y-3">
                <div>
                    <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Quick Paste (optional)</label>
                    <textarea id="cfg-paste" rows="4" oninput="parsePastedConfig()" placeholder="Paste the whole firebaseConfig = { ... } block from the Firebase console here" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white font-mono"></textarea>
                </div>
                <div>
                    <label class="block text-xs uppercase font-bold text-slate-400 mb-1">API Key</label>
                    <input type="text" id="cfg-apikey" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                </div>
                <div>
                    <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Auth Domain</label>
                    <input type="text" id="cfg-authdomain" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                </div>
                <div>
                    <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Project ID</label>
                    <input type="text" id="cfg-projectid" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                </div>
                <div>
                    <label class="block text-xs uppercase font-bold text-slate-400 mb-1">App ID</label>
                    <input type="text" id="cfg-appid" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                </div>
                <div class="flex space-x-3 pt-3">
                    <button type="button" onclick="closeModals()" class="flex-1 bg-slate-700 hover:bg-slate-600 py-2.5 rounded-xl font-medium text-sm">Cancel</button>
                    <button type="submit" class="flex-1 bg-red-600 hover:bg-red-500 py-2.5 rounded-xl font-semibold text-sm shadow">Save & Connect</button>
                </div>
            </form>
            <button onclick="clearFirebaseConfig()" class="w-full mt-3 bg-slate-900 text-red-400 border border-slate-700 py-2 rounded-xl text-xs font-semibold">Clear Keys</button>
        </div>
    </div>

    <!-- PWA Modal -->
    <div id="pwa-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-2xl p-5 shadow-2xl">
            <h3 class="text-lg font-bold mb-3 flex items-center space-x-2">
                <i class="fa-solid fa-mobile-screen-button text-red-500"></i>
                <span>Add to Home Screen</span>
            </h3>
            <p class="text-xs text-slate-300 mb-3">Use your browser's menu and select <b>"Add to Home Screen"</b>.</p>
            <button onclick="closeModals()" class="w-full bg-slate-700 py-2.5 rounded-xl font-semibold text-sm">Got It</button>
        </div>
    </div>

    <!-- App Logic -->
    <!-- Plain (non-module) script so every button works even if Firebase fails to load. -->
    <script>
        const CONFIG_KEY = 'xmas_fb_config';
        let db = null;
        let fs = null;            // Firestore functions, loaded on demand
        let useFirebase = false;
        let state = { recipients: [], expenses: [] };

        // ---------- Helpers ----------
        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function setStatus(text, color) {
            const el = document.getElementById('sync-status');
            el.innerText = text;
            el.className = `text-xs font-semibold ${color}`;
        }

        function loadJSON(key, fallback) {
            try {
                const v = JSON.parse(localStorage.getItem(key));
                return v ?? fallback;
            } catch (e) {
                return fallback;
            }
        }

        // ---------- Modals ----------
        function openAddRecipientModal() {
            document.getElementById('recipient-id').value = '';
            document.getElementById('recipient-name').value = '';
            document.getElementById('recipient-budget').value = '';
            document.getElementById('recipient-modal-title').innerText = 'Add Recipient';
            document.getElementById('recipient-modal').classList.remove('hidden');
        }

        function openEditRecipientModal(id) {
            const rec = state.recipients.find(r => r.id === id);
            if (!rec) return;
            document.getElementById('recipient-id').value = rec.id;
            document.getElementById('recipient-name').value = rec.name || '';
            document.getElementById('recipient-budget').value = Number(rec.budget) || 0;
            document.getElementById('recipient-modal-title').innerText = 'Edit Recipient';
            document.getElementById('recipient-modal').classList.remove('hidden');
        }

        function openPwaModal() {
            document.getElementById('pwa-modal').classList.remove('hidden');
        }

        function closeModals() {
            document.querySelectorAll('[id$="-modal"]').forEach(m => m.classList.add('hidden'));
        }

        function openSettingsModal() {
            const c = loadJSON(CONFIG_KEY, {});
            document.getElementById('cfg-paste').value = '';
            document.getElementById('cfg-apikey').value = c.apiKey || '';
            document.getElementById('cfg-authdomain').value = c.authDomain || '';
            document.getElementById('cfg-projectid').value = c.projectId || '';
            document.getElementById('cfg-appid').value = c.appId || '';
            document.getElementById('settings-modal').classList.remove('hidden');
        }

        function openAddExpenseModal(id) {
            const rec = state.recipients.find(r => r.id === id);
            document.getElementById('expense-recipient-id').value = id;
            document.getElementById('expense-modal-subtitle').innerText = `For ${rec ? rec.name : 'Recipient'}`;
            document.getElementById('expense-modal').classList.remove('hidden');
        }

        // Close a modal when tapping the dark background behind it
        document.querySelectorAll('[id$="-modal"]').forEach(m => {
            m.addEventListener('click', e => { if (e.target === m) closeModals(); });
        });

        // ---------- Settings ----------
        // Pull values out of a pasted "const firebaseConfig = { apiKey: "...", ... }" snippet
        function parsePastedConfig() {
            const text = document.getElementById('cfg-paste').value;
            const grab = key => {
                const m = text.match(new RegExp(`["']?${key}["']?\\s*:\\s*["']([^"']+)["']`));
                return m ? m[1] : null;
            };
            const map = { apiKey: 'cfg-apikey', authDomain: 'cfg-authdomain', projectId: 'cfg-projectid', appId: 'cfg-appid' };
            for (const [key, inputId] of Object.entries(map)) {
                const v = grab(key);
                if (v) document.getElementById(inputId).value = v;
            }
        }

        function handleSaveSettings(e) {
            e.preventDefault();
            const config = {
                apiKey: document.getElementById('cfg-apikey').value.trim(),
                authDomain: document.getElementById('cfg-authdomain').value.trim(),
                projectId: document.getElementById('cfg-projectid').value.trim(),
                appId: document.getElementById('cfg-appid').value.trim()
            };
            if (!config.apiKey || !config.projectId) {
                alert('API Key and Project ID are required.');
                return;
            }
            if (!config.authDomain) config.authDomain = `${config.projectId}.firebaseapp.com`;
            localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
            location.reload(); // Restart cleanly with the new keys
        }

        function clearFirebaseConfig() {
            if (!confirm('Remove Firebase keys from this device and go back to Local Mode?')) return;
            localStorage.removeItem(CONFIG_KEY);
            location.reload();
        }

        // ---------- Storage ----------
        function enableLocalStorageMode(statusText) {
            useFirebase = false;
            db = null;
            setStatus(statusText || 'Local Mode (Keys Needed)', 'text-amber-400');
            state.recipients = loadJSON('xmas_recipients', [
                { id: '1', name: 'Daughter', budget: 150 },
                { id: '2', name: 'Sister-in-Law', budget: 50 }
            ]);
            state.expenses = loadJSON('xmas_expenses', [
                { id: 'e1', recipientId: '1', item: 'Lego Set', cost: 45.00, buyer: 'Dad' }
            ]);
            render();
        }

        function saveLocalData() {
            localStorage.setItem('xmas_recipients', JSON.stringify(state.recipients));
            localStorage.setItem('xmas_expenses', JSON.stringify(state.expenses));
            render();
        }

        function handleFirestoreError(err) {
            console.error('Firestore error:', err);
            if (err && err.code === 'permission-denied') {
                setStatus('Sync Blocked: check Firestore rules', 'text-red-400');
            } else {
                setStatus('Sync Error: ' + (err && err.code ? err.code : 'see console'), 'text-red-400');
            }
        }

        async function initFirebase() {
            const config = loadJSON(CONFIG_KEY, null);
            if (!config || !config.apiKey || !config.projectId) {
                enableLocalStorageMode();
                return;
            }

            setStatus('Connecting to Firebase...', 'text-slate-400');
            try {
                const appMod = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
                fs = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');

                const app = appMod.initializeApp(config);
                db = fs.getFirestore(app);
                useFirebase = true;

                let loaded = 0;
                const markLoaded = () => {
                    loaded++;
                    if (loaded >= 2) setStatus('Cloud Sync Active (Live)', 'text-emerald-400');
                };
                let gotRecipients = false, gotExpenses = false;

                fs.onSnapshot(fs.collection(db, 'recipients'), snap => {
                    state.recipients = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    if (!gotRecipients) { gotRecipients = true; markLoaded(); }
                    render();
                }, handleFirestoreError);

                fs.onSnapshot(fs.collection(db, 'expenses'), snap => {
                    state.expenses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    if (!gotExpenses) { gotExpenses = true; markLoaded(); }
                    render();
                }, handleFirestoreError);

                state = { recipients: [], expenses: [] };
                render();
            } catch (err) {
                console.error('Firebase Init Error:', err);
                enableLocalStorageMode('Firebase failed: using Local Mode');
            }
        }

        // ---------- Rendering ----------
        function render() {
            const container = document.getElementById('recipients-container');
            if (!container) return;

            let totalBudget = 0;
            let totalSpent = 0;
            let html = '';

            if (state.recipients.length === 0) {
                html = `<p class="text-center text-sm text-slate-500 italic py-8">No recipients yet. Tap "Add Family Member" to start.</p>`;
            }

            state.recipients.forEach(rec => {
                const recExpenses = state.expenses.filter(e => e.recipientId === rec.id);
                const spent = recExpenses.reduce((sum, e) => sum + (Number(e.cost) || 0), 0);
                const budget = Number(rec.budget) || 0;
                const remaining = budget - spent;

                totalBudget += budget;
                totalSpent += spent;

                const pct = budget > 0 ? Math.min(100, Math.round((spent / budget) * 100)) : 0;
                let barColor = 'bg-emerald-500';
                if (pct > 85) barColor = 'bg-amber-500';
                if (pct >= 100) barColor = 'bg-red-500';

                const recId = escapeHtml(rec.id);

                html += `
                    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-md">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <h3 class="font-bold text-base text-white">${escapeHtml(rec.name)}</h3>
                                <p class="text-xs text-slate-400">Budget: $${budget.toFixed(2)}</p>
                            </div>
                            <div class="text-right">
                                <span class="text-lg font-bold ${remaining < 0 ? 'text-red-400' : 'text-emerald-400'}">$${remaining.toFixed(2)}</span>
                                <p class="text-[10px] uppercase text-slate-400">Remaining</p>
                            </div>
                        </div>
                        <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden mb-3">
                            <div class="${barColor} h-full transition-all duration-300" style="width: ${pct}%"></div>
                        </div>
                        <div class="space-y-2 mb-3">
                `;

                if (recExpenses.length === 0) {
                    html += `<p class="text-xs text-slate-500 italic">No gifts added yet.</p>`;
                } else {
                    recExpenses.forEach(exp => {
                        html += `
                            <div class="flex justify-between items-center bg-slate-900/60 px-3 py-2 rounded-xl text-xs">
                                <div>
                                    <span class="font-medium text-slate-200">${escapeHtml(exp.item)}</span>
                                    <span class="text-[10px] text-slate-400 ml-1">(${escapeHtml(exp.buyer)})</span>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <span class="font-bold text-white">$${(Number(exp.cost) || 0).toFixed(2)}</span>
                                    <button data-action="delete-expense" data-id="${escapeHtml(exp.id)}" class="text-slate-500 hover:text-red-400 p-1"><i class="fa-solid fa-trash-can"></i></button>
                                </div>
                            </div>
                        `;
                    });
                }

                html += `
                        </div>
                        <div class="flex space-x-2 pt-2 border-t border-slate-700/60">
                            <button data-action="add-gift" data-id="${recId}" class="flex-1 bg-slate-700 hover:bg-slate-600 py-2 rounded-xl text-xs font-semibold flex items-center justify-center space-x-1">
                                <i class="fa-solid fa-plus text-[10px]"></i><span>Add Gift</span>
                            </button>
                            <button data-action="edit-recipient" data-id="${recId}" title="Edit name / budget" class="bg-slate-700/50 hover:bg-slate-600 text-slate-400 hover:text-white px-3 py-2 rounded-xl text-xs"><i class="fa-solid fa-pen"></i></button>
                            <button data-action="delete-recipient" data-id="${recId}" class="bg-slate-700/50 hover:bg-red-900/40 text-slate-400 hover:text-red-300 px-3 py-2 rounded-xl text-xs"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            document.getElementById('total-budget-display').innerText = `$${totalBudget.toFixed(2)}`;
            document.getElementById('total-spent-display').innerText = `$${totalSpent.toFixed(2)}`;
        }

        // One click handler for all card buttons (safe with names containing quotes)
        document.getElementById('recipients-container').addEventListener('click', e => {
            const btn = e.target.closest('button[data-action]');
            if (!btn) return;
            const id = btn.dataset.id;
            if (btn.dataset.action === 'add-gift') openAddExpenseModal(id);
            if (btn.dataset.action === 'delete-expense') deleteExpense(id);
            if (btn.dataset.action === 'edit-recipient') openEditRecipientModal(id);
            if (btn.dataset.action === 'delete-recipient') deleteRecipient(id);
        });

        // ---------- Actions ----------
        async function handleSaveRecipient(e) {
            e.preventDefault();
            const form = e.target;
            const id = document.getElementById('recipient-id').value;
            const name = document.getElementById('recipient-name').value.trim();
            const budget = parseFloat(document.getElementById('recipient-budget').value) || 0;
            if (!name) return;

            try {
                if (id) {
                    // Editing an existing person
                    if (useFirebase) {
                        await fs.updateDoc(fs.doc(db, 'recipients', id), { name, budget });
                    } else {
                        const rec = state.recipients.find(r => r.id === id);
                        if (rec) { rec.name = name; rec.budget = budget; }
                        saveLocalData();
                    }
                } else if (useFirebase) {
                    await fs.addDoc(fs.collection(db, 'recipients'), { name, budget });
                } else {
                    state.recipients.push({ id: 'rec_' + Date.now(), name, budget });
                    saveLocalData();
                }
                closeModals();
                form.reset();
            } catch (err) {
                handleFirestoreError(err);
                alert('Could not save recipient: ' + (err.message || err));
            }
        }

        async function handleSaveExpense(e) {
            e.preventDefault();
            const form = e.target;
            const recipientId = document.getElementById('expense-recipient-id').value;
            const item = document.getElementById('expense-item').value.trim();
            const cost = parseFloat(document.getElementById('expense-cost').value) || 0;
            const buyer = document.getElementById('expense-buyer').value.trim() || 'Family';
            if (!item) return;

            try {
                if (useFirebase) {
                    await fs.addDoc(fs.collection(db, 'expenses'), { recipientId, item, cost, buyer });
                } else {
                    state.expenses.push({ id: 'exp_' + Date.now(), recipientId, item, cost, buyer });
                    saveLocalData();
                }
                closeModals();
                form.reset();
            } catch (err) {
                handleFirestoreError(err);
                alert('Could not save gift: ' + (err.message || err));
            }
        }

        async function deleteExpense(id) {
            if (!confirm('Delete this gift?')) return;
            try {
                if (useFirebase) {
                    await fs.deleteDoc(fs.doc(db, 'expenses', id));
                } else {
                    state.expenses = state.expenses.filter(e => e.id !== id);
                    saveLocalData();
                }
            } catch (err) {
                handleFirestoreError(err);
                alert('Could not delete gift: ' + (err.message || err));
            }
        }

        async function deleteRecipient(id) {
            const rec = state.recipients.find(r => r.id === id);
            if (!confirm(`Delete ${rec ? rec.name : 'this recipient'} and all their gifts?`)) return;
            try {
                if (useFirebase) {
                    const related = state.expenses.filter(e => e.recipientId === id);
                    await Promise.all(related.map(e => fs.deleteDoc(fs.doc(db, 'expenses', e.id))));
                    await fs.deleteDoc(fs.doc(db, 'recipients', id));
                } else {
                    state.recipients = state.recipients.filter(r => r.id !== id);
                    state.expenses = state.expenses.filter(e => e.recipientId !== id);
                    saveLocalData();
                }
            } catch (err) {
                handleFirestoreError(err);
                alert('Could not delete recipient: ' + (err.message || err));
            }
        }

        // ---------- Start ----------
        initFirebase();
    </script>
</body>
